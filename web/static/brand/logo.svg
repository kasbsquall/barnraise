<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Barnraise">
  <!-- Barnraise mark. Six neighbors on a ring, every one wired to the same hub:
       the neighborhood is the structure, not any single organization.
       currentColor so the mark inherits ink from whatever it sits on. -->
  <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="32" r="27" stroke-width="1.6"/>
    <circle cx="32" cy="32" r="16" stroke-width="1.2" opacity="0.55"/>
    <!-- spokes, hub to each station -->
    <path d="M32 32 32 16" stroke-width="1.6"/>
    <path d="M32 32 45.86 24" stroke-width="1.6"/>
    <path d="M32 32 45.86 40" stroke-width="1.6"/>
    <path d="M32 32 32 48" stroke-width="1.6"/>
    <path d="M32 32 18.14 40" stroke-width="1.6"/>
    <path d="M32 32 18.14 24" stroke-width="1.6"/>
  </g>
  <g fill="currentColor">
    <circle cx="32" cy="32" r="4.2"/>
    <circle cx="32" cy="16" r="2.9"/>
    <circle cx="45.86" cy="24" r="2.9"/>
    <circle cx="45.86" cy="40" r="2.9"/>
    <circle cx="32" cy="48" r="2.9"/>
    <circle cx="18.14" cy="40" r="2.9"/>
    <circle cx="18.14" cy="24" r="2.9"/>
  </g>
</svg>
